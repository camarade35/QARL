name: 'Release'

run-name: 'Release ${{ github.ref_name }} par ${{ github.actor }}'

'on':
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm install

      - name: Load release notes
        id: release_notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $notesPath = ".github/RELEASE_NOTES.md"
          if (-not (Test-Path $notesPath)) {
            throw "Release notes file not found: $notesPath"
          }

          $notes = Get-Content -Path $notesPath -Raw
          if ([string]::IsNullOrWhiteSpace($notes)) {
            throw "Release notes file is empty: $notesPath"
          }

          $version = $env:RELEASE_TAG -replace '^v', ''
          $notes = $notes.Replace('{{VERSION}}', $version)
          $delimiter = "RELEASE_NOTES_$([guid]::NewGuid().ToString('N'))"
          "body<<$delimiter" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          "$delimiter" >> $env:GITHUB_OUTPUT

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'QARL ${{ github.ref_name }}'
          releaseBody: ${{ contains(github.ref_name, '-') && format('⚠️ VERSION BETA ({0}) - À tester uniquement. Ne pas installer si vous cherchez la stabilité.', github.ref_name) || steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true