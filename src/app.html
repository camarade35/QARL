<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QARL</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" style="background-color: #0f1219; margin: 0; overflow: hidden;">
    
    <!-- ⭐ SPLASH SCREEN NATIF (S'affiche instantanément à l'ouverture de la fenêtre) -->
    <div id="global-splash" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f1219; z-index: 99999; transition: opacity 0.4s ease;">
      <!-- ⭐ Le Logo -->
      <img src="%sveltekit.assets%/assets/logo.png" alt="QARL" style="width: 180px; height: auto; margin-bottom: 24px; user-select: none; -webkit-user-drag: none;" />
      
      <div style="width: 48px; height: 48px; border: 4px solid rgba(255, 255, 255, 0.12); border-top-color: #e6a33b; border-radius: 50%; animation: splash-spin 0.9s linear infinite; margin-bottom: 20px;"></div>
      <div style="color: rgba(255, 255, 255, 0.5); font-family: sans-serif; font-size: 0.9rem; letter-spacing: 1px;">CHARGEMENT DE QARL...</div>
      <style>
        @keyframes splash-spin { to { transform: rotate(360deg); } }
      </style>
    </div>

    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
